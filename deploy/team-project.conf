<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/team-project/public

    <Directory /var/www/team-project/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/team-project/config>
        Require all denied
    </Directory>

    <Directory /var/www/team-project/.git>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/team-project-error.log
    CustomLog ${APACHE_LOG_DIR}/team-project-access.log combined
</VirtualHost>
